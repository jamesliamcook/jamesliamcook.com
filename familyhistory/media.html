<style>
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#fff}
.gate form{width:min(420px,100%);border-top:1px solid #1d1a16;padding-top:22px}
.gate h1{font-family:"Pinyon Script",cursive;font-weight:400;font-size:64px;line-height:1.05;margin:0 0 6px;color:#1d1a16}
.gate h1 em{font-style:normal}

.gate .err{font-family:"Jost",Arial,sans-serif;font-size:12.5px;color:#a3261d;min-height:20px;margin-top:12px}
.gate.embed{min-height:0;height:100vh}
</style>

function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function hex(buf){return [].map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2)}).join('');}
function store(){try{return sessionStorage}catch(e){return null}}
function lstore(){try{return localStorage}catch(e){return null}}
async function keyFromRaw(raw){return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);}
async function derive(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,256);
  return new Uint8Array(bits);
}
async function check(raw){var h=await crypto.subtle.digest('SHA-256',raw);return hex(h).slice(0,16)===P.check;}
async function dec(key,u){return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));}
async function runScripts(ss){
  for(var i=0;i<ss.length;i++){
    var o=ss[i],n=document.createElement('script');
    for(var a=0;a<o.attributes.length;a++)n.setAttribute(o.attributes[a].name,o.attributes[a].value);
    if(o.src){await new Promise(function(res){n.onload=n.onerror=res;o.parentNode.replaceChild(n,o);});}
    else{n.textContent=o.textContent;o.parentNode.replaceChild(n,o);}
  }
}
async function open(raw){
  var key=await keyFromRaw(raw);
  var htmlBuf=await dec(key,b64(CT));
  var doc=new TextDecoder().decode(htmlBuf);
  var m=doc.match(/<title>([\s\S]*?)<\/title>/); if(m){var t=document.createElement('textarea');t.innerHTML=m[1];document.title=t.value;}
  var hm=doc.match(/<head>([\s\S]*?)<\/head>/i), bm=doc.match(/<body[^>]*>([\s\S]*)<\/body>/i);
  if(hm){var tmp=document.createElement('div');tmp.innerHTML=hm[1];tmp.querySelectorAll('style').forEach(function(s){document.head.appendChild(s)});}
  document.getElementById('gate').remove();
  var wrap=document.createElement('div');wrap.id='fh-root';wrap.innerHTML=bm?bm[1]:doc;
  // images: swap encrypted sources for decrypted blob URLs
  // decrypt each image only as it comes near the screen
  var load=function(img){ var s=img.getAttribute('data-enc'),e=IMG[s]; if(!e||img.dataset.dec)return null; img.dataset.dec='1';
    return fetch('d/'+e[0]).then(function(r){return r.text()}).then(function(t){return dec(key,b64(t.trim()))})
      .then(function(p){img.src=URL.createObjectURL(new Blob([p],{type:e[1]}));}).catch(function(){}); };
  var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){io.unobserve(en.target);load(en.target);}})},{rootMargin:'900px 0px'}):null;
  var imgs=[].filter.call(wrap.querySelectorAll('img[src]'),function(img){var s=img.getAttribute('src'); if(!IMG[s])return false; img.removeAttribute('src'); img.setAttribute('data-enc',s); return true;});
  window.FH_load=load;
  var ss=[].slice.call(wrap.querySelectorAll('script'));
  while(wrap.firstChild)document.body.appendChild(wrap.firstChild);
  wrap.remove();
  await runScripts(ss);
  if(window.FH_init)window.FH_init(document);
  KEY=raw;
  window.FH_text=function(p){var e=DATA[p]; if(!e)return Promise.reject(new Error('no data')); return keyFromRaw(raw).then(function(k){return fetch('d/'+e).then(function(r){return r.text()}).then(function(t){return dec(k,b64(t.trim()))})}).then(function(b){return new TextDecoder().decode(b)});};
  [].forEach.call(document.querySelectorAll('iframe'),function(f){
    var send=function(){try{f.contentWindow.postMessage({fhKey:rawB64(raw)},location.origin)}catch(e){}};
    f.addEventListener('load',send); send();
  });
  imgs.forEach(function(img){ if(io) io.observe(img); else load(img); });
}
var KEY=null, OPENING=false;
window.addEventListener('message',function(e){
  if(e.origin!==location.origin||!e.data||!e.data.fhKey||KEY||OPENING)return;
  var raw=b64(e.data.fhKey); OPENING=true;
  check(raw).then(function(ok){if(ok&&document.getElementById('gate'))return open(raw);}).catch(function(){}).then(function(){OPENING=false});
});
if('scrollRestoration' in history)history.scrollRestoration='manual';
function rawB64(raw){var s='';raw.forEach(function(x){s+=String.fromCharCode(x)});return btoa(s);}
async function start(){
  var ss=store(),ls=lstore(),saved=(ss&&ss.getItem('fh-key'))||(ls&&ls.getItem('fh-key'));
  if(saved){try{var raw=b64(saved);if(await check(raw)){await open(raw);return;}}catch(e){}}
  var g=document.getElementById('gate'); g.hidden=false;
  if(window.self!==window.top)g.classList.add('embed');
  else document.getElementById('pw').focus({preventScroll:true});
  document.getElementById('gf').addEventListener('submit',async function(ev){
    ev.preventDefault();
    var err=document.getElementById('gerr'); err.textContent='Opening…';
    try{
      var raw=await derive(document.getElementById('pw').value);
      if(!(await check(raw))){err.textContent='That password is not right. Try again.';return;}
      var k=rawB64(raw); if(ss)ss.setItem('fh-key',k);
      if(document.getElementById('remember').checked&&ls)ls.setItem('fh-key',k);
      err.textContent=''; await open(raw);
    }catch(e){err.textContent='The page could not be opened in this browser.';}
  });
}
if(!window.crypto||!crypto.subtle){document.getElementById('gate').hidden=false;document.getElementById('gerr').textContent='This browser cannot open protected pages. Use an up-to-date browser over https.';}
else start();
})();
