function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}

async function keyFromRaw(raw){return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);}
async function derive(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,256);
  return new Uint8Array(bits);
}
async function check(raw){var h=await crypto.subtle.digest('SHA-256',raw);return hex(h).slice(0,16)===P.check;}
async function dec(key,u){return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));}
async function runScripts(ss){
  for(var i=0;i<ss.length;i++){
    var o=ss[i],n=document.createElement('script');
    for(var a=0;a<o.attributes.length;a++)n.setAttribute(o.attributes[a].name,o.attributes[a].value);
    if(o.src){await new Promise(function(res){n.onload=n.onerror=res;o.parentNode.replaceChild(n,o);});}
    else{n.textContent=o.textContent;o.parentNode.replaceChild(n,o);}
  }
}
