  (function(){var q=imgs.slice(),n=0,go=function(){while(n<3&&q.length){var im=q.shift();if(im.dataset.dec)continue;n++;var pr=load(im);if(io)io.unobserve(im);(pr||Promise.resolve()).then(function(){n--;go();});}};
    var start=function(){setTimeout(go,400)}; if(document.readyState==='complete')start(); else window.addEventListener('load',start);})();
}
var KEY=null, OPENING=false;

function rawB64(raw){var s='';raw.forEach(function(x){s+=String.fromCharCode(x)});return btoa(s);}

  });
}
